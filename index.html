<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed Eggs — It Hungers</title>
    <link rel="stylesheet" href="./styles.css" />
  <!-- lifecycle: hub regenerates by scanning these. -->
<meta name="surface-status" content="live">
</head>
  <body>
<style>.fm-hub-corner{position:fixed;top:0;left:0;z-index:99999;font-family:ui-monospace,"IBM Plex Mono",monospace;font-size:11px;background:#ebe5d6;color:#1c5d7a;text-decoration:none;padding:5px 10px;border:1px solid #c9c1ac;border-top:0;border-left:0;border-bottom-right-radius:4px}.fm-hub-corner:hover{text-decoration:underline}@media print{.fm-hub-corner{display:none}}</style>
<a class="fm-hub-corner" href="../field-manuals.html">⌂ Hub</a>
    <main class="desktop-shell">
      <section class="app-window" aria-label="Feed Eggs game window">
        <header class="window-top">
          <div class="window-spacer" aria-hidden="true"></div>
          <h1 class="window-title">FEED EGGS</h1>
          <div class="window-actions">
            <button id="sound-toggle" class="system-button" type="button">SOUND ON</button>
            <button id="reset-button" class="system-button" type="button">RESET</button>
          </div>
        </header>

        <section class="playfield" id="playfield" aria-live="polite">
          <div class="hud-panel">
            <p class="hud-label">SCORE: <span id="score-display">0</span></p>
            <p class="hud-label">BEST: <span id="best-display">0</span></p>
            <p class="hud-label">LEVEL: <span id="level-display">1</span></p>
            <p class="hud-label">STREAK: <span id="streak-display">0</span></p>
          </div>

          <div class="medal-banner" id="medal-banner" hidden>
            <p id="medal-text">DOUBLE KILL</p>
          </div>

          <div class="target-zone" id="target-zone" aria-label="Egg mouth target">
            <div class="target-art" id="target-art"></div>
            <div class="mouth-hitbox" id="mouth-hitbox" aria-hidden="true"></div>
          </div>

          <div class="launcher-zone" id="launcher-zone" aria-label="Slingshot launcher area">
            <div class="launcher-frame" id="launcher-frame" aria-hidden="true"></div>
            <div class="launcher-egg" id="launcher-egg" aria-hidden="true"></div>
            <svg class="trajectory-overlay" id="trajectory-overlay" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none">
              <polyline id="trajectory-line" points="" />
            </svg>
          </div>
        </section>

        <footer class="status-bar">
          <p class="status-line" id="status-line">Drag eggs into mouth.</p>
        </footer>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
